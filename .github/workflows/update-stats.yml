name: Update GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate stats.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          USERNAME = 'Nezerkill'
          TOKEN = os.environ.get('GITHUB_TOKEN', '')
          headers = {
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'bio-site-stats-updater'
          }
          if TOKEN:
              headers['Authorization'] = f'Bearer {TOKEN}'

          def fetch_json(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response), response.headers

          def parse_last_page(link_header):
              if not link_header:
                  return None
              match = re.search(r'[?&]page=(\d+)>; rel="last"', link_header)
              return int(match.group(1)) if match else None

          def fetch_commit_count(repo_name, since_iso):
              url = (
                  f'https://api.github.com/repos/{USERNAME}/{repo_name}/commits'
                  f'?author={USERNAME}&since={urllib.parse.quote(since_iso)}&per_page=1'
              )
              commits, response_headers = fetch_json(url)
              last_page = parse_last_page(response_headers.get('Link'))
              if last_page is not None:
                  return last_page
              return len(commits) if isinstance(commits, list) else 0

          since_iso = (datetime.now(timezone.utc) - timedelta(days=30)).isoformat()
          profile, _ = fetch_json(f'https://api.github.com/users/{USERNAME}')
          repos, _ = fetch_json(f'https://api.github.com/users/{USERNAME}/repos?per_page=100&type=owner')

          stars = sum(int(repo.get('stargazers_count') or 0) for repo in repos)
          commits_last_month = 0
          for repo in repos:
              commits_last_month += fetch_commit_count(repo['name'], since_iso)

          payload = {
              'stars': stars,
              'commits_last_month': commits_last_month,
              'followers': int(profile.get('followers') or 0),
              'updated_at': datetime.now(timezone.utc).isoformat()
          }

          with open('stats.json', 'w', encoding='utf-8') as file:
              json.dump(payload, file, indent=2)
              file.write('\n')
          PY

      - name: Commit updated stats
        run: |
          if git diff --quiet -- stats.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add stats.json
          git commit -m "chore: refresh github stats"
          git push

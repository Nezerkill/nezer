  <script>document.documentElement.classList.add('js');</script>

  <style>
    :root {
      --font-sans: 'Manrope', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;

      --background: #0e1223;
      --background-deep: #090d19;
      --surface: rgba(27, 31, 48, 0.82);
      --surface-strong: rgba(48, 52, 70, 0.9);
      --surface-soft: rgba(65, 69, 89, 0.28);
      --surface-softer: rgba(98, 104, 128, 0.14);
      --text: #dee1f9;
      --text-soft: #cec3cf;
      --text-muted: #aab1d3;
      --primary: #e5baff;
      --primary-strong: #ca9ee6;
      --secondary: #8caaee;
      --tertiary: #81c8be;
      --glow: rgba(222, 225, 249, 0.08);
      --highlight: rgba(229, 186, 255, 0.24);
      --ghost-border: rgba(115, 121, 148, 0.18);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --space-1: 6px;
      --space-2: 10px;
      --space-3: 14px;
      --space-4: 18px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 40px;
      --space-8: 52px;
      --page-gutter: clamp(16px, 4vw, 36px);
      --panel-padding: clamp(24px, 4vw, 52px);
      --card-width: min(1080px, calc(100vw - (var(--page-gutter) * 2)));
      --transition: 220ms ease;
      --parallax-x: 0px;
      --parallax-y: 0px;
      --card-rotate-x: 0deg;
      --card-rotate-y: 0deg;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(circle at 28% 24%, rgba(202, 158, 230, 0.28), transparent 20%),
        radial-gradient(circle at 73% 66%, rgba(140, 170, 238, 0.16), transparent 20%),
        linear-gradient(160deg, rgba(9, 13, 25, 0.98), rgba(14, 18, 35, 0.92)),
        var(--background);
      display: flex;
      align-items: stretch;
      justify-content: center;
      padding: clamp(18px, 3vw, 36px) var(--page-gutter);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(135deg, rgba(9, 13, 25, 0.78), rgba(9, 13, 25, 0.38)),
        image-set(url('./background.webp') 1x, url('./background.jpg') 1x) center/cover no-repeat;
      filter: saturate(0.9) blur(1px);
      transform: translate(calc(var(--parallax-x) * -0.8), calc(var(--parallax-y) * -0.8)) scale(1.04);
      opacity: 0.6;
      transition: transform 240ms ease-out;
    }

    body::after {
      background:
        radial-gradient(circle at 34% 18%, rgba(202, 158, 230, 0.16), transparent 24%),
        radial-gradient(circle at 64% 72%, rgba(140, 170, 238, 0.14), transparent 28%);
      mix-blend-mode: screen;
      opacity: 0.8;
    }

    a {
      color: inherit;
    }

    .icon {
      display: block;
      width: 1em;
      height: 1em;
      flex: none;
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
      border-radius: 6px;
    }

    .page-shell {
      position: relative;
      width: 100%;
      min-height: calc(100dvh - (clamp(18px, 3vw, 36px) * 2));
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .cursor-glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
      transform: translate3d(-1000px, -1000px, 0);
      background:
        radial-gradient(circle, rgba(202, 158, 230, 0.18) 0%, rgba(140, 170, 238, 0.12) 34%, rgba(14, 18, 35, 0) 72%);
      filter: blur(18px);
      transition: opacity 240ms ease;
    }

    .ambient-ring,
    .ambient-ring::before,
    .ambient-ring::after {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .ambient-ring {
      width: 92vw;
      max-width: 1280px;
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      transform: translate(calc(-50% + (var(--parallax-x) * 0.45)), calc(-50% + (var(--parallax-y) * 0.45)));
      border: 28px solid rgba(202, 158, 230, 0.07);
      filter: blur(1px);
      opacity: 0.85;
      transition: transform 260ms ease-out;
    }

    .ambient-ring::before,
    .ambient-ring::after {
      content: '';
      inset: 11%;
      border: 20px solid rgba(140, 170, 238, 0.08);
    }

    .ambient-ring::after {
      inset: 24%;
      border-color: rgba(229, 186, 255, 0.12);
    }

    .card {
      position: relative;
      width: var(--card-width);
      display: grid;
      grid-template-columns: minmax(300px, 0.92fr) minmax(0, 1.18fr);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(27, 31, 48, 0.84), rgba(20, 24, 38, 0.76));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.34), 0 0 60px var(--glow), inset 0 1px 0 rgba(229, 186, 255, 0.12);
      overflow: hidden;
      min-height: min(760px, calc(100dvh - 72px));
      transform: perspective(1400px) rotateX(var(--card-rotate-x)) rotateY(var(--card-rotate-y));
      transition: transform 620ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow var(--transition);
      transform-style: preserve-3d;
    }

    .js .card {
      opacity: 0;
      transform: perspective(1400px) translateY(28px) rotateX(var(--card-rotate-x)) rotateY(var(--card-rotate-y)) scale(0.985);
      transition: opacity 520ms ease, transform 620ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow var(--transition);
    }

    .js .card.is-visible {
      opacity: 1;
      transform: perspective(1400px) rotateX(var(--card-rotate-x)) rotateY(var(--card-rotate-y));
    }

    .card.is-tilting {
      box-shadow: 0 32px 96px rgba(0, 0, 0, 0.38), 0 0 80px rgba(222, 225, 249, 0.1), inset 0 1px 0 rgba(229, 186, 255, 0.14);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(229, 186, 255, 0.04), transparent 38%, rgba(140, 170, 238, 0.03));
      pointer-events: none;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: -30% auto -30% -20%;
      width: 42%;
      background: linear-gradient(115deg, transparent, rgba(229, 186, 255, 0.08), transparent);
      transform: translateX(-180%) rotate(10deg);
      pointer-events: none;
      opacity: 0;
    }

    .js .card.is-visible::after {
      opacity: 1;
      animation: cardShimmer 1.25s ease 180ms 1;
    }

    .profile-panel,
    .content-panel {
      position: relative;
      padding: var(--panel-padding);
    }

    .profile-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--space-5);
      background: linear-gradient(180deg, rgba(42, 44, 66, 0.28), rgba(27, 31, 48, 0.08));
      text-align: center;
    }

    .profile-panel::after {
      content: '';
      position: absolute;
      top: var(--space-8);
      right: 0;
      width: 1px;
      height: calc(100% - (var(--space-8) * 2));
      background: linear-gradient(180deg, transparent, rgba(115, 121, 148, 0.22), transparent);
      opacity: 0.55;
    }

    .content-panel {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      justify-content: center;
      align-items: stretch;
      text-align: left;
    }

    .avatar-shell {
      position: relative;
      width: 124px;
      height: 124px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(229, 186, 255, 0.3), rgba(140, 170, 238, 0.08));
      box-shadow: 0 0 0 1px rgba(229, 186, 255, 0.2), 0 0 40px rgba(202, 158, 230, 0.22);
    }

    .avatar-shell::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      box-shadow: 0 0 0 12px rgba(98, 104, 128, 0.14);
      opacity: 0.8;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(14, 18, 35, 0.6);
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform var(--transition), filter var(--transition);
      filter: saturate(0.92) contrast(1.04);
    }

    .avatar-shell:hover img {
      transform: scale(1.08);
      filter: saturate(1) contrast(1.06);
    }

    .profile-copy {
      text-align: center;
      max-width: 320px;
      margin: 0 auto;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-muted);
      font-size: 10px;
      margin-bottom: var(--space-4);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 4vw, 56px);
      line-height: 0.96;
      letter-spacing: -0.05em;
      font-weight: 700;
      text-shadow: 0 10px 36px rgba(0, 0, 0, 0.24);
    }

    .identity-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 46px;
      padding: 0 var(--space-5);
      margin-top: var(--space-5);
      border-radius: var(--radius-md);
      background: rgba(65, 69, 89, 0.34);
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.14);
      color: var(--text-soft);
      font-size: 12px;
    }

    .identity-badge,
    .meta-badge,
    .stat-label,
    .activity-label {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.2em;
    }

    .meta-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(65, 69, 89, 0.24);
      color: var(--text-muted);
      font-size: 11px;
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.12);
    }

    .meta-badge .icon {
      width: 13px;
      height: 13px;
      color: var(--secondary);
    }

    .panel-top {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      width: 100%;
      max-width: 100%;
    }

    .music-widget,
    .stats-widget {
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(48, 52, 70, 0.32), rgba(27, 31, 48, 0.18));
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.08);
      padding: clamp(20px, 3vw, 28px);
    }

    .music-widget {
      background: linear-gradient(180deg, rgba(48, 52, 70, 0.22), rgba(20, 24, 38, 0.18));
    }

    .widget-header,
    .widget-status {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .widget-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: clamp(16px, 2.5vw, 20px);
    }

    .panel-kicker {
      font-family: var(--font-sans);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
    }

    .widget-header .icon {
      width: 16px;
      height: 16px;
      color: var(--primary);
    }

    .widget-status {
      color: var(--secondary);
      font-family: var(--font-mono);
      letter-spacing: 0.12em;
      font-size: 11px;
      text-decoration: none;
      border-radius: 999px;
      transition: color var(--transition);
    }

    .widget-status:hover {
      color: var(--primary);
    }

    .widget-status .icon {
      width: 12px;
      height: 12px;
    }

    .track-card {
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr);
      gap: var(--space-4);
      align-items: center;
    }

    .track-art {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(229, 186, 255, 0.85), rgba(202, 158, 230, 0.15) 35%, transparent 36%),
        linear-gradient(135deg, rgba(140, 170, 238, 0.18), rgba(229, 186, 255, 0.08)),
        #120f1d;
      box-shadow: inset 0 0 0 1px rgba(229, 186, 255, 0.28), 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .track-art::before,
    .track-art::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      border: 1px solid rgba(202, 158, 230, 0.3);
      transform: rotate(45deg);
    }

    .track-art::after {
      inset: 19px;
      border-color: rgba(140, 170, 238, 0.22);
      transform: rotate(10deg);
    }

    .track-pulse {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--primary-strong);
      text-shadow: 0 0 22px rgba(202, 158, 230, 0.7);
    }

    .track-pulse .icon {
      width: 20px;
      height: 20px;
    }

    .track-meta {
      min-width: 0;
      text-align: left;
    }

    .track-title {
      margin: 0;
      font-size: clamp(24px, 2.5vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.04em;
      font-weight: 600;
      color: var(--text);
      overflow-wrap: anywhere;
    }

    .track-artist {
      margin: var(--space-1) 0 0;
      font-size: 16px;
      color: var(--text-soft);
    }

    .player-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: var(--space-3);
      margin-top: var(--space-4);
    }

    #play-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(229, 186, 255, 0.26), rgba(202, 158, 230, 0.14));
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      box-shadow: inset 0 0 0 1px rgba(229, 186, 255, 0.18);
    }

    #play-btn .icon {
      width: 16px;
      height: 16px;
    }

    #play-btn:hover {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 12px 28px rgba(202, 158, 230, 0.2), inset 0 0 0 1px rgba(229, 186, 255, 0.26);
      background: linear-gradient(135deg, rgba(229, 186, 255, 0.32), rgba(202, 158, 230, 0.18));
    }

    #play-btn:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    .progress {
      position: relative;
      height: 6px;
      width: 100%;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(98, 104, 128, 0.2);
      cursor: pointer;
    }

    .bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-strong));
      box-shadow: 0 0 16px rgba(229, 186, 255, 0.34);
    }

    .time,
    .time-total {
      min-width: 38px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .stats-widget {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .stat-card {
      position: relative;
      min-height: 94px;
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      border-radius: var(--radius-md);
      background: rgba(65, 69, 89, 0.2);
      transition: transform var(--transition), background var(--transition);
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.08);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      background: rgba(65, 69, 89, 0.28);
    }

    .stat-card .icon {
      width: 18px;
      height: 18px;
      color: var(--secondary);
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .stat-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translate(-50%, 8px);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(48, 52, 70, 0.9);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18), inset 0 0 0 1px rgba(229, 186, 255, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition), transform var(--transition);
    }

    .stat-card.has-tooltip:hover .stat-tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .activity-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .activity-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
    }

    .activity-label {
      font-size: 11px;
      color: rgba(170, 177, 211, 0.72);
    }

    .activity-dots {
      display: flex;
      gap: var(--space-1);
      align-items: center;
    }

    .activity-dots span,
    .activity-grid span {
      display: block;
      border-radius: 3px;
      background: rgba(98, 104, 128, 0.18);
    }

    .activity-dots span {
      width: 8px;
      height: 8px;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(30, minmax(0, 1fr));
      gap: var(--space-1);
    }

    .activity-grid span {
      height: 10px;
    }

    .activity-grid span.level-1 {
      background: rgba(202, 158, 230, 0.28);
    }

    .activity-grid span.level-2 {
      background: rgba(202, 158, 230, 0.46);
    }

    .activity-grid span.level-3 {
      background: rgba(229, 186, 255, 0.64);
    }

    .activity-grid span.level-4 {
      background: rgba(229, 186, 255, 0.88);
    }

    .activity-grid.is-empty {
      display: none;
    }

    .social {
      display: flex;
      justify-content: flex-start;
      gap: var(--space-4);
      flex-wrap: wrap;
      width: 100%;
    }

    .s-btn {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      text-decoration: none;
      color: var(--text-soft);
      background: rgba(65, 69, 89, 0.22);
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.08);
      transition: transform var(--transition), background var(--transition), color var(--transition), box-shadow var(--transition);
    }

    .s-btn .icon {
      width: 20px;
      height: 20px;
    }

    .s-btn:hover {
      transform: translateY(-2px);
      color: var(--text);
      background: rgba(65, 69, 89, 0.3);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.16), inset 0 0 0 1px rgba(229, 186, 255, 0.12);
    }

    .s-btn:hover .icon {
      color: var(--primary);
    }

    @keyframes cardShimmer {
      0% {
        transform: translateX(-180%) rotate(10deg);
      }

      100% {
        transform: translateX(430%) rotate(10deg);
      }
    }

    @media (max-width: 1180px) {
      .ambient-ring {
        width: 110vw;
      }

      .card {
        grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1.1fr);
      }
    }

    @media (max-width: 960px) {
      .card {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .profile-panel::after {
        top: auto;
        right: var(--panel-padding);
        bottom: 0;
        width: calc(100% - (var(--panel-padding) * 2));
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(115, 121, 148, 0.22), transparent);
      }

      .profile-panel,
      .content-panel {
        justify-content: flex-start;
      }

      .content-panel {
        text-align: center;
      }

      .social {
        justify-content: center;
      }

    }

    @media (max-width: 720px) {
      .ambient-ring {
        width: 145vw;
        opacity: 0.7;
      }

      .track-card,
      .player-row,
      .widget-topline,
      .activity-head {
        gap: 12px;
      }

      .player-row {
        grid-template-columns: auto 1fr auto;
      }

      .widget-topline,
      .activity-head {
        flex-wrap: wrap;
      }

      .time-total {
        display: none;
      }

      .stat-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .activity-grid {
        grid-template-columns: repeat(15, minmax(0, 1fr));
      }

      .social {
        gap: 12px;
      }

      .s-btn {
        width: 46px;
        height: 46px;
      }
    }

    @media (max-width: 540px) {
      .page-shell {
        align-items: flex-start;
      }

      .card {
        border-radius: 22px;
      }

      .profile-panel,
      .content-panel {
        padding: 28px 20px;
      }

      .avatar-shell {
        width: 112px;
        height: 112px;
      }

      .avatar {
        width: 92px;
        height: 92px;
      }

      h1 {
        font-size: clamp(32px, 11vw, 42px);
      }

      .identity-badge {
        width: 100%;
        padding: 12px 18px;
      }

      .track-card {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .track-meta {
        text-align: center;
      }

      .player-row {
        grid-template-columns: 1fr;
      }

      #play-btn,
      .time,
      .time-total {
        justify-self: center;
      }

      .time-total {
        display: block;
      }

      .stat-grid {
        grid-template-columns: 1fr;
      }

      .activity-grid {
        grid-template-columns: repeat(10, minmax(0, 1fr));
      }

      .social {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(46px, 1fr));
      }

      .s-btn {
        width: 100%;
      }
    }

    @media (pointer: coarse) {
      .cursor-glow {
        display: none;
      }

      .card,
      .js .card,
      .js .card.is-visible {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }

      body::before,
      .ambient-ring {
        transform: none;
      }

      .js .card,
      .js .card.is-visible {
        transform: none;
      }
    }

    @supports not (backdrop-filter: blur(1px)) {
      .card {
        background: rgba(27, 31, 48, 0.96);
      }
    }
  </style>

  <script>
    (function () {
      'use strict';

      var card = document.getElementById('bioCard');
      var glow = document.getElementById('cursorGlow');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      var finePointer = window.matchMedia('(pointer: fine)');

      function motionAllowed() {
        return finePointer.matches && !reduceMotion.matches;
      }

      if (card) {
        requestAnimationFrame(function () {
          card.classList.add('is-visible');
        });
      }

      var frame = 0;
      var pointer = { x: 0, y: 0 };
      var parallax = { x: 0, y: 0 };

      function applyPointer() {
        frame = 0;
        var root = document.documentElement;
        root.style.setProperty('--parallax-x', parallax.x.toFixed(2) + 'px');
        root.style.setProperty('--parallax-y', parallax.y.toFixed(2) + 'px');

        if (glow) {
          glow.style.transform = 'translate3d(' + pointer.x + 'px,' + pointer.y + 'px,0) translate(-50%,-50%)';
        }
      }

      document.addEventListener('pointermove', function (event) {
        if (!motionAllowed()) {
          return;
        }

        pointer.x = event.clientX;
        pointer.y = event.clientY;
        parallax.x = (event.clientX / window.innerWidth - 0.5) * 18;
        parallax.y = (event.clientY / window.innerHeight - 0.5) * 18;

        if (!frame) {
          frame = requestAnimationFrame(applyPointer);
        }
      }, { passive: true });

      function resetTilt() {
        if (!card) {
          return;
        }

        card.style.setProperty('--card-rotate-x', '0deg');
        card.style.setProperty('--card-rotate-y', '0deg');
        card.classList.remove('is-tilting');
      }

      if (card) {
        card.addEventListener('pointermove', function (event) {
          if (!motionAllowed() || event.pointerType === 'touch') {
            return;
          }

          var rect = card.getBoundingClientRect();
          var x = (event.clientX - rect.left) / rect.width - 0.5;
          var y = (event.clientY - rect.top) / rect.height - 0.5;

          card.style.setProperty('--card-rotate-y', (x * 8).toFixed(2) + 'deg');
          card.style.setProperty('--card-rotate-x', (-y * 8).toFixed(2) + 'deg');
          card.classList.add('is-tilting');
        }, { passive: true });

        card.addEventListener('pointerleave', resetTilt);
      }

      if (typeof reduceMotion.addEventListener === 'function') {
        reduceMotion.addEventListener('change', resetTilt);
      }

      function compact(value) {
        if (!Number.isFinite(value)) {
          return '--';
        }

        return new Intl.NumberFormat('en', {
          notation: 'compact',
          maximumFractionDigits: 1
        }).format(value);
      }

      function paintActivity(days) {
        var grid = document.getElementById('activity-grid');

        if (!grid) {
          return;
        }

        if (!Array.isArray(days) || !days.length) {
          grid.classList.add('is-empty');
          return;
        }

        var counts = days.map(function (day) { return Number(day.count) || 0; });
        var max = Math.max.apply(null, counts);
        var total = counts.reduce(function (sum, count) { return sum + count; }, 0);

        grid.textContent = '';
        grid.setAttribute('aria-label', total + ' contributions in the last ' + days.length + ' days');

        days.forEach(function (day, index) {
          var cell = document.createElement('span');
          var count = counts[index];
          var level = count === 0 || max === 0 ? 0 : Math.min(4, Math.ceil(count / max * 4));
          cell.className = 'level-' + level;
          cell.title = day.date + ': ' + count;
          grid.appendChild(cell);
        });
      }

      function paintUpdated(value) {
        var node = document.getElementById('updated-at');
        var date = new Date(value);

        if (!node || Number.isNaN(date.getTime())) {
          return;
        }

        node.textContent = date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
        node.title = date.toISOString();
      }

      fetch('./stats.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('stats.json request failed');
          }

          return response.json();
        })
        .then(function (data) {
          document.getElementById('github-stars').textContent = compact(Number(data.stars));
          document.getElementById('github-commits').textContent = compact(Number(data.commits_last_month));
          document.getElementById('github-followers').textContent = compact(Number(data.followers));
          paintActivity(data.contribution_days);
          paintUpdated(data.updated_at);
        })
        .catch(function () {
          document.getElementById('github-stars').textContent = '--';
          document.getElementById('github-commits').textContent = '--';
          document.getElementById('github-followers').textContent = '--';
          paintActivity([]);
        });

      var audio = document.getElementById('audio');
      var playBtn = document.getElementById('play-btn');
      var progress = document.getElementById('progress');
      var progressBar = document.getElementById('progress-bar');
      var timeEl = document.getElementById('time');
      var durationEl = document.getElementById('duration');

      function formatTime(value) {
        if (!Number.isFinite(value) || value < 0) {
          return '0:00';
        }

        var minutes = Math.floor(value / 60);
        var seconds = Math.floor(value % 60);
        return minutes + ':' + String(seconds).padStart(2, '0');
      }

      function syncPlayState() {
        var playing = !audio.paused;
        playBtn.innerHTML = playing
          ? '<svg class="icon" aria-hidden="true"><use href="#i-pause"></use></svg>'
          : '<svg class="icon" aria-hidden="true"><use href="#i-play"></use></svg>';
        playBtn.setAttribute('aria-label', playing ? 'Pause' : 'Play');
      }

      playBtn.addEventListener('click', function () {
        if (audio.paused) {
          audio.play().catch(function () {
            playBtn.setAttribute('aria-label', 'Audio unavailable');
            playBtn.disabled = true;
          });
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('loadedmetadata', function () {
        durationEl.textContent = formatTime(audio.duration);
      });

      audio.addEventListener('timeupdate', function () {
        var duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
        var percent = duration ? (audio.currentTime / duration) * 100 : 0;

        progressBar.style.width = percent + '%';
        progress.setAttribute('aria-valuenow', String(Math.round(percent)));
        timeEl.textContent = formatTime(audio.currentTime);
      });

      audio.addEventListener('play', syncPlayState);
      audio.addEventListener('pause', syncPlayState);

      audio.addEventListener('error', function () {
        playBtn.disabled = true;
        playBtn.setAttribute('aria-label', 'Audio unavailable');
      });

      function seek(event) {
        if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
          return;
        }

        var rect = progress.getBoundingClientRect();
        var ratio = Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1);
        audio.currentTime = ratio * audio.duration;
      }

      progress.addEventListener('click', seek);

      progress.addEventListener('keydown', function (event) {
        if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
          return;
        }

        var step = event.shiftKey ? 15 : 5;

        if (event.key === 'ArrowRight' || event.key === 'ArrowUp') {
          event.preventDefault();
          audio.currentTime = Math.min(audio.duration, audio.currentTime + step);
        } else if (event.key === 'ArrowLeft' || event.key === 'ArrowDown') {
          event.preventDefault();
          audio.currentTime = Math.max(0, audio.currentTime - step);
        } else if (event.key === 'Home') {
          event.preventDefault();
          audio.currentTime = 0;
        } else if (event.key === 'End') {
          event.preventDefault();
          audio.currentTime = audio.duration;
        }
      });

      audio.addEventListener('ended', function () {
        progressBar.style.width = '0%';
        progress.setAttribute('aria-valuenow', '0');
        timeEl.textContent = '0:00';
        syncPlayState();
      });
    })();
  </script>

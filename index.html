<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>nezerkill - Bio</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --font-sans: 'Manrope', sans-serif;
      --font-mono: 'IBM Plex Mono', monospace;

      --background: #0e1223;
      --background-deep: #090d19;
      --surface: rgba(27, 31, 48, 0.82);
      --surface-strong: rgba(48, 52, 70, 0.9);
      --surface-soft: rgba(65, 69, 89, 0.28);
      --surface-softer: rgba(98, 104, 128, 0.14);
      --text: #dee1f9;
      --text-soft: #cec3cf;
      --text-muted: #aab1d3;
      --primary: #e5baff;
      --primary-strong: #ca9ee6;
      --secondary: #8caaee;
      --tertiary: #81c8be;
      --glow: rgba(222, 225, 249, 0.08);
      --highlight: rgba(229, 186, 255, 0.24);
      --ghost-border: rgba(115, 121, 148, 0.18);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 16px;
      --space-1: 6px;
      --space-2: 10px;
      --space-3: 14px;
      --space-4: 18px;
      --space-5: 24px;
      --space-6: 32px;
      --space-7: 40px;
      --space-8: 52px;
      --card-width: min(960px, calc(100vw - 32px));
      --transition: 220ms ease;
      --parallax-x: 0px;
      --parallax-y: 0px;
      --card-rotate-x: 0deg;
      --card-rotate-y: 0deg;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--text);
      background:
        radial-gradient(circle at 28% 24%, rgba(202, 158, 230, 0.28), transparent 20%),
        radial-gradient(circle at 73% 66%, rgba(140, 170, 238, 0.16), transparent 20%),
        linear-gradient(160deg, rgba(9, 13, 25, 0.98), rgba(14, 18, 35, 0.92)),
        var(--background);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        linear-gradient(135deg, rgba(9, 13, 25, 0.78), rgba(9, 13, 25, 0.38)),
        url('./background.jpg') center/cover no-repeat;
      filter: saturate(0.9) blur(1px);
      transform: translate(calc(var(--parallax-x) * -0.8), calc(var(--parallax-y) * -0.8)) scale(1.04);
      opacity: 0.6;
      transition: transform 240ms ease-out;
    }

    body::after {
      background:
        radial-gradient(circle at 34% 18%, rgba(202, 158, 230, 0.16), transparent 24%),
        radial-gradient(circle at 64% 72%, rgba(140, 170, 238, 0.14), transparent 28%);
      mix-blend-mode: screen;
      opacity: 0.8;
    }

    a {
      color: inherit;
    }

    .page-shell {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      z-index: 1;
    }

    .cursor-glow {
      position: fixed;
      left: 0;
      top: 0;
      width: 340px;
      height: 340px;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
      transform: translate3d(-50%, -50%, 0);
      background:
        radial-gradient(circle, rgba(202, 158, 230, 0.18) 0%, rgba(140, 170, 238, 0.12) 34%, rgba(14, 18, 35, 0) 72%);
      filter: blur(18px);
      transition: opacity 240ms ease;
    }

    .ambient-ring,
    .ambient-ring::before,
    .ambient-ring::after {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .ambient-ring {
      width: 92vw;
      max-width: 1280px;
      aspect-ratio: 1;
      top: 50%;
      left: 50%;
      transform: translate(calc(-50% + (var(--parallax-x) * 0.45)), calc(-50% + (var(--parallax-y) * 0.45)));
      border: 28px solid rgba(202, 158, 230, 0.07);
      filter: blur(1px);
      opacity: 0.85;
      transition: transform 260ms ease-out;
    }

    .ambient-ring::before,
    .ambient-ring::after {
      content: '';
      inset: 11%;
      border: 20px solid rgba(140, 170, 238, 0.08);
    }

    .ambient-ring::after {
      inset: 24%;
      border-color: rgba(229, 186, 255, 0.12);
    }

    .reveal-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-5);
      background: rgba(9, 13, 25, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      transition: opacity 400ms ease, visibility 400ms ease;
    }

    .reveal-overlay::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(229, 186, 255, 0.34), rgba(140, 170, 238, 0.12) 24%, transparent 48%);
      opacity: 0;
      transform: scale(0.72);
      pointer-events: none;
    }

    .reveal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .reveal-overlay.is-flashing::after {
      animation: revealFlash 560ms ease-out forwards;
    }

    .reveal-overlay.hidden .reveal-content {
      transform: translateY(18px) scale(0.96);
      opacity: 0;
    }

    .reveal-content {
      width: min(420px, 100%);
      padding: var(--space-7) var(--space-6);
      text-align: center;
      border-radius: var(--radius-xl);
      background: linear-gradient(180deg, rgba(48, 52, 70, 0.62), rgba(27, 31, 48, 0.78));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.28), inset 0 1px 0 rgba(229, 186, 255, 0.18);
      opacity: 0;
      transform: translateY(24px) scale(0.94);
      animation: revealIntro 780ms cubic-bezier(0.22, 1, 0.36, 1) 120ms forwards;
      transition: transform 360ms ease, opacity 300ms ease;
    }

    .reveal-icon {
      width: 88px;
      height: 88px;
      margin: 0 auto var(--space-5);
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(229, 186, 255, 0.28), rgba(140, 170, 238, 0.16));
      box-shadow: 0 0 0 10px rgba(98, 104, 128, 0.12), 0 0 44px rgba(202, 158, 230, 0.18);
      font-size: 34px;
      color: var(--primary);
      animation: pulse 2.6s ease-in-out infinite;
    }

    .reveal-kicker,
    .stat-label,
    .panel-kicker,
    .meta-badge,
    .activity-label,
    .identity-badge {
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.24em;
    }

    .reveal-text {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.03em;
      color: var(--text);
      opacity: 0;
      transform: translateY(10px);
      animation: revealTextIntro 680ms ease 260ms forwards;
    }

    .card {
      position: relative;
      width: var(--card-width);
      display: grid;
      grid-template-columns: minmax(270px, 0.9fr) minmax(0, 1.3fr);
      border-radius: var(--radius-xl);
      background: linear-gradient(145deg, rgba(27, 31, 48, 0.84), rgba(20, 24, 38, 0.76));
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 26px 80px rgba(0, 0, 0, 0.34), 0 0 60px var(--glow), inset 0 1px 0 rgba(229, 186, 255, 0.12);
      overflow: hidden;
      min-height: 560px;
      opacity: 0;
      transform: perspective(1400px) translateY(28px) rotateX(var(--card-rotate-x)) rotateY(var(--card-rotate-y)) scale(0.985);
      transition: opacity 520ms ease, transform 620ms cubic-bezier(0.22, 1, 0.36, 1), box-shadow var(--transition);
      transform-style: preserve-3d;
      will-change: transform;
    }

    .card.is-visible {
      opacity: 1;
      transform: perspective(1400px) translateY(0) rotateX(var(--card-rotate-x)) rotateY(var(--card-rotate-y)) scale(1);
    }

    .card.is-tilting {
      box-shadow: 0 32px 96px rgba(0, 0, 0, 0.38), 0 0 80px rgba(222, 225, 249, 0.1), inset 0 1px 0 rgba(229, 186, 255, 0.14);
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(229, 186, 255, 0.04), transparent 38%, rgba(140, 170, 238, 0.03));
      pointer-events: none;
    }

    .card::after {
      content: '';
      position: absolute;
      inset: -30% auto -30% -20%;
      width: 42%;
      background: linear-gradient(115deg, transparent, rgba(229, 186, 255, 0.08), transparent);
      transform: translateX(-180%) rotate(10deg);
      pointer-events: none;
      opacity: 0;
    }

    .card.is-visible::after {
      opacity: 1;
      animation: cardShimmer 1.25s ease 180ms 1;
    }

    .profile-panel,
    .content-panel {
      position: relative;
      padding: var(--space-8);
    }

    .profile-panel {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: var(--space-5);
      background: linear-gradient(180deg, rgba(42, 44, 66, 0.28), rgba(27, 31, 48, 0.08));
    }

    .profile-panel::after {
      content: '';
      position: absolute;
      top: var(--space-8);
      right: 0;
      width: 1px;
      height: calc(100% - (var(--space-8) * 2));
      background: linear-gradient(180deg, transparent, rgba(115, 121, 148, 0.22), transparent);
      opacity: 0.55;
    }

    .content-panel {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .avatar-shell {
      position: relative;
      width: 124px;
      height: 124px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle, rgba(229, 186, 255, 0.3), rgba(140, 170, 238, 0.08));
      box-shadow: 0 0 0 1px rgba(229, 186, 255, 0.2), 0 0 40px rgba(202, 158, 230, 0.22);
    }

    .avatar-shell::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      box-shadow: 0 0 0 12px rgba(98, 104, 128, 0.14);
      opacity: 0.8;
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      background: rgba(14, 18, 35, 0.6);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.02);
      transition: transform var(--transition), filter var(--transition);
      filter: saturate(0.92) contrast(1.04);
    }

    .avatar-shell:hover img {
      transform: scale(1.08);
      filter: saturate(1) contrast(1.06);
    }

    .profile-copy {
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      color: var(--text-muted);
      font-size: 10px;
      margin-bottom: var(--space-4);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 4vw, 56px);
      line-height: 0.96;
      letter-spacing: -0.05em;
      font-weight: 700;
      text-shadow: 0 10px 36px rgba(0, 0, 0, 0.24);
    }

    .identity-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 46px;
      padding: 0 var(--space-5);
      margin-top: var(--space-5);
      border-radius: var(--radius-md);
      background: rgba(65, 69, 89, 0.34);
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.14);
      color: var(--text-soft);
      font-size: 12px;
    }

    .bio {
      margin: 0;
      color: var(--text-soft);
      font-size: 15px;
      line-height: 1.75;
      max-width: 280px;
      margin-left: auto;
      margin-right: auto;
    }

    .meta-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: var(--space-2);
    }

    .meta-badge {
      display: inline-flex;
      align-items: center;
      gap: var(--space-2);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(65, 69, 89, 0.24);
      color: var(--text-muted);
      font-size: 10px;
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.12);
    }

    .meta-badge i {
      color: var(--secondary);
    }

    .views-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(202, 158, 230, 0.28), rgba(140, 170, 238, 0.18));
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1;
      box-shadow: inset 0 0 0 1px rgba(229, 186, 255, 0.12);
    }

    .panel-top {
      display: flex;
      flex-direction: column;
      gap: var(--space-6);
      width: min(100%, 440px);
    }

    .music-widget,
    .stats-widget {
      border-radius: var(--radius-lg);
      background: linear-gradient(180deg, rgba(48, 52, 70, 0.32), rgba(27, 31, 48, 0.18));
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.08);
    }

    .music-widget {
      padding: var(--space-2) 0 0;
      background: transparent;
      box-shadow: none;
    }

    .widget-header,
    .widget-status {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }

    .widget-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-4);
      margin-bottom: var(--space-4);
    }

    .panel-kicker {
      font-family: var(--font-sans);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.28em;
    }

    .widget-header i,
    .widget-status i {
      color: var(--primary);
    }

    .widget-status {
      color: var(--secondary);
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.2em;
      font-size: 10px;
    }

    .track-card {
      display: grid;
      grid-template-columns: 60px minmax(0, 1fr);
      gap: var(--space-4);
      align-items: center;
    }

    .track-art {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(229, 186, 255, 0.85), rgba(202, 158, 230, 0.15) 35%, transparent 36%),
        linear-gradient(135deg, rgba(140, 170, 238, 0.18), rgba(229, 186, 255, 0.08)),
        #120f1d;
      box-shadow: inset 0 0 0 1px rgba(229, 186, 255, 0.28), 0 12px 28px rgba(0, 0, 0, 0.22);
    }

    .track-art::before,
    .track-art::after {
      content: '';
      position: absolute;
      inset: 12px;
      border-radius: 14px;
      border: 1px solid rgba(202, 158, 230, 0.3);
      transform: rotate(45deg);
    }

    .track-art::after {
      inset: 19px;
      border-color: rgba(140, 170, 238, 0.22);
      transform: rotate(10deg);
    }

    .track-pulse {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-size: 20px;
      color: var(--primary-strong);
      text-shadow: 0 0 22px rgba(202, 158, 230, 0.7);
    }

    .track-meta {
      min-width: 0;
      text-align: left;
    }

    .track-title {
      margin: 0;
      font-size: clamp(24px, 2.5vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.04em;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      margin: var(--space-1) 0 0;
      font-size: 16px;
      color: var(--text-soft);
    }

    .player-row {
      display: grid;
      grid-template-columns: auto 1fr auto auto;
      align-items: center;
      gap: var(--space-3);
      margin-top: var(--space-4);
    }

    #play-btn {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(229, 186, 255, 0.26), rgba(202, 158, 230, 0.14));
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      box-shadow: inset 0 0 0 1px rgba(229, 186, 255, 0.18);
    }

    #play-btn:hover {
      transform: translateY(-1px) scale(1.03);
      box-shadow: 0 12px 28px rgba(202, 158, 230, 0.2), inset 0 0 0 1px rgba(229, 186, 255, 0.26);
      background: linear-gradient(135deg, rgba(229, 186, 255, 0.32), rgba(202, 158, 230, 0.18));
    }

    .progress {
      position: relative;
      height: 6px;
      width: 100%;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(98, 104, 128, 0.2);
      cursor: pointer;
    }

    .bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary), var(--primary-strong));
      box-shadow: 0 0 16px rgba(229, 186, 255, 0.34);
    }

    .time,
    .time-total {
      min-width: 38px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    .stats-widget {
      padding: var(--space-5);
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-3);
    }

    .stat-card {
      position: relative;
      min-height: 94px;
      padding: var(--space-4) var(--space-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      border-radius: var(--radius-md);
      background: rgba(65, 69, 89, 0.2);
      transition: transform var(--transition), background var(--transition);
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.08);
    }

    .stat-card:hover {
      transform: translateY(-2px);
      background: rgba(65, 69, 89, 0.28);
    }

    .stat-card i {
      color: var(--secondary);
      font-size: 18px;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }

    .stat-label {
      font-size: 9px;
      color: var(--text-muted);
    }

    .stat-tooltip {
      position: absolute;
      left: 50%;
      bottom: calc(100% + 10px);
      transform: translate(-50%, 8px);
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(48, 52, 70, 0.9);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      white-space: nowrap;
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.18), inset 0 0 0 1px rgba(229, 186, 255, 0.12);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition), transform var(--transition);
    }

    .stat-card.has-tooltip:hover .stat-tooltip {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .activity-block {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }

    .activity-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--space-4);
    }

    .activity-label {
      font-size: 9px;
      color: rgba(170, 177, 211, 0.72);
    }

    .activity-dots {
      display: flex;
      gap: var(--space-1);
      align-items: center;
    }

    .activity-dots span,
    .activity-grid span {
      display: block;
      border-radius: 3px;
      background: rgba(98, 104, 128, 0.18);
    }

    .activity-dots span {
      width: 8px;
      height: 8px;
    }

    .activity-grid {
      display: grid;
      grid-template-columns: repeat(27, minmax(0, 1fr));
      gap: var(--space-1);
    }

    .activity-grid span {
      height: 10px;
    }

    .activity-grid span:nth-child(4n) {
      background: rgba(202, 158, 230, 0.32);
    }

    .activity-grid span:nth-child(5n) {
      background: rgba(202, 158, 230, 0.52);
    }

    .activity-grid span:nth-child(9n) {
      background: rgba(229, 186, 255, 0.8);
    }

    .social {
      display: flex;
      justify-content: center;
      gap: var(--space-4);
      flex-wrap: wrap;
      width: min(100%, 440px);
    }

    .s-btn {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      text-decoration: none;
      font-size: 20px;
      color: var(--text-soft);
      background: rgba(65, 69, 89, 0.22);
      box-shadow: inset 0 0 0 1px rgba(115, 121, 148, 0.08);
      transition: transform var(--transition), background var(--transition), color var(--transition), box-shadow var(--transition);
    }

    .s-btn:hover {
      transform: translateY(-2px);
      color: var(--text);
      background: rgba(65, 69, 89, 0.3);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.16), inset 0 0 0 1px rgba(229, 186, 255, 0.12);
    }

    .s-btn.spotify:hover,
    .s-btn.github:hover,
    .s-btn.telegram:hover,
    .s-btn.youtube:hover,
    .s-btn.twitch:hover {
      color: var(--primary);
    }

    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.06);
      }
    }

    @keyframes cardShimmer {
      0% {
        transform: translateX(-180%) rotate(10deg);
      }

      100% {
        transform: translateX(430%) rotate(10deg);
      }
    }

    @keyframes revealIntro {
      0% {
        opacity: 0;
        transform: translateY(24px) scale(0.94);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes revealTextIntro {
      0% {
        opacity: 0;
        transform: translateY(10px);
      }

      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes revealFlash {
      0% {
        opacity: 0;
        transform: scale(0.72);
      }

      35% {
        opacity: 0.95;
        transform: scale(1);
      }

      100% {
        opacity: 0;
        transform: scale(1.24);
      }
    }

    @media (max-width: 900px) {
      .card {
        grid-template-columns: 1fr;
      }

      .profile-panel::after {
        top: auto;
        right: var(--space-8);
        bottom: 0;
        width: calc(100% - (var(--space-8) * 2));
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(115, 121, 148, 0.22), transparent);
      }

    }

    @media (max-width: 720px) {
      body {
        padding: 16px;
      }

      .profile-panel,
      .content-panel {
        padding: 32px 22px;
      }

      .track-card,
      .player-row,
      .widget-topline,
      .activity-head {
        gap: 12px;
      }

      .player-row {
        grid-template-columns: auto 1fr auto;
      }

      .time-total {
        display: none;
      }

      .stat-grid {
        grid-template-columns: 1fr;
      }

      .activity-grid {
        grid-template-columns: repeat(18, minmax(0, 1fr));
      }

      .social {
        gap: 12px;
      }

      .s-btn {
        width: 46px;
        height: 46px;
      }
    }

    @media (pointer: coarse) {
      .cursor-glow {
        display: none;
      }
    }

    @supports not (backdrop-filter: blur(1px)) {
      .card,
      .reveal-content {
        background: rgba(27, 31, 48, 0.96);
      }

      .reveal-overlay {
        background: rgba(9, 13, 25, 0.9);
      }
    }
  </style>
</head>
<body>
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <div class="reveal-overlay" id="revealOverlay">
    <div class="reveal-content">
      <div class="reveal-icon">
        <i class="fa-solid fa-fingerprint"></i>
      </div>
      <p class="reveal-text">Click to reveal</p>
    </div>
  </div>

  <div class="page-shell">
    <div class="ambient-ring" aria-hidden="true"></div>

    <main class="card" id="bioCard">
      <section class="profile-panel">
        <div class="avatar-shell">
          <div class="avatar">
            <img src="./avatar.jpg" alt="Avatar">
          </div>
        </div>

        <div class="profile-copy">
          <h1>nezerkill</h1>
          <div class="identity-badge">LINUX USER | PYTHON PROGRAMMER</div>
        </div>

        <div class="meta-row">
          <div class="meta-badge">
            <i class="fa-solid fa-eye"></i>
            <span>Views</span>
            <span class="views-count" id="views-count">--</span>
          </div>
          <div class="meta-badge"><i class="fa-solid fa-circle"></i> Active</div>
        </div>
      </section>

      <section class="content-panel">
        <div class="panel-top">
          <section class="music-widget">
            <div class="widget-topline">
              <div class="widget-header">
                <i class="fa-brands fa-spotify"></i>
                <span class="panel-kicker">Now Playing</span>
              </div>
            </div>

            <div class="track-card">
              <div class="track-art" aria-hidden="true">
                <div class="track-pulse"><i class="fa-solid fa-record-vinyl"></i></div>
              </div>

              <div class="track-meta">
                <p class="track-title">abandon her soul</p>
                <p class="track-artist">hkmori</p>
              </div>
            </div>

            <div class="player-row">
              <button id="play-btn" aria-label="Play"><i class="fa-solid fa-play"></i></button>
              <div class="progress" id="progress" aria-label="Track progress">
                <div class="bar" id="progress-bar"></div>
              </div>
              <span class="time" id="time">0:00</span>
              <span class="time-total" id="duration">0:00</span>
            </div>
            <audio id="audio" src="./hkmori - abandon her soul.flac"></audio>
          </section>

          <section class="stats-widget">
            <div class="widget-topline">
              <div class="widget-header">
                <i class="fa-brands fa-github"></i>
                <span class="panel-kicker">GitHub Statistics</span>
              </div>
              <div class="widget-status"><i class="fa-solid fa-circle"></i> Active</div>
            </div>

            <div class="stat-grid">
              <article class="stat-card">
                <i class="fa-solid fa-star"></i>
                <div class="stat-value" id="github-stars">--</div>
                <div class="stat-label">Stars</div>
              </article>

              <article class="stat-card has-tooltip">
                <i class="fa-solid fa-rotate-left"></i>
                <div class="stat-value" id="github-commits">--</div>
                <div class="stat-label">Commits</div>
                <div class="stat-tooltip">Last Month</div>
              </article>

              <article class="stat-card">
                <i class="fa-solid fa-users"></i>
                <div class="stat-value" id="github-followers">--</div>
                <div class="stat-label">Followers</div>
              </article>
            </div>

            <div class="activity-block">
              <div class="activity-head">
                <span class="activity-label">Commit activity</span>
                <div class="activity-dots" aria-hidden="true">
                  <span></span>
                  <span></span>
                  <span></span>
                  <span style="background: rgba(229, 186, 255, 0.84);"></span>
                </div>
              </div>
              <div class="activity-grid" aria-hidden="true">
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
                <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
              </div>
            </div>
          </section>
        </div>

        <footer class="social">
          <a class="s-btn github" href="https://github.com/Nezerkill" target="_blank" rel="noreferrer" title="GitHub">
            <i class="fa-brands fa-github"></i>
          </a>
          <a class="s-btn telegram" href="https://t.me/nezerkill" target="_blank" rel="noreferrer" title="Telegram">
            <i class="fa-brands fa-telegram"></i>
          </a>
          <a class="s-btn spotify" href="https://open.spotify.com/user/nezerkill" target="_blank" rel="noreferrer" title="Spotify">
            <i class="fa-brands fa-spotify"></i>
          </a>
          <a class="s-btn youtube" href="https://www.youtube.com/@Nezerkill" target="_blank" rel="noreferrer" title="YouTube">
            <i class="fa-brands fa-youtube"></i>
          </a>
          <a class="s-btn twitch" href="https://www.twitch.tv/nezer_kill" target="_blank" rel="noreferrer" title="Twitch">
            <i class="fa-brands fa-twitch"></i>
          </a>
        </footer>
      </section>
    </main>
  </div>

  <script>
    const revealOverlay = document.getElementById('revealOverlay');
    const bioCard = document.getElementById('bioCard');
    const cursorGlow = document.getElementById('cursorGlow');

    requestAnimationFrame(function() {
      bioCard.classList.add('is-visible');
    });

    revealOverlay.addEventListener('click', function() {
      this.classList.add('is-flashing');
      this.classList.add('hidden');
      bioCard.classList.add('is-visible');
    });

    bioCard.addEventListener('mousemove', function(event) {
      const rect = bioCard.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      const rotateY = (x - 0.5) * 8;
      const rotateX = (0.5 - y) * 8;

      document.documentElement.style.setProperty('--card-rotate-x', rotateX.toFixed(2) + 'deg');
      document.documentElement.style.setProperty('--card-rotate-y', rotateY.toFixed(2) + 'deg');
      bioCard.classList.add('is-tilting');
    });

    bioCard.addEventListener('mouseleave', function() {
      document.documentElement.style.setProperty('--card-rotate-x', '0deg');
      document.documentElement.style.setProperty('--card-rotate-y', '0deg');
      bioCard.classList.remove('is-tilting');
    });

    document.addEventListener('mousemove', function(event) {
      const xRatio = (event.clientX / window.innerWidth) - 0.5;
      const yRatio = (event.clientY / window.innerHeight) - 0.5;

      document.documentElement.style.setProperty('--parallax-x', (xRatio * 18).toFixed(2) + 'px');
      document.documentElement.style.setProperty('--parallax-y', (yRatio * 18).toFixed(2) + 'px');

      if (cursorGlow) {
        cursorGlow.style.left = event.clientX + 'px';
        cursorGlow.style.top = event.clientY + 'px';
      }
    });

    document.addEventListener('mouseleave', function() {
      document.documentElement.style.setProperty('--parallax-x', '0px');
      document.documentElement.style.setProperty('--parallax-y', '0px');

      if (cursorGlow) {
        cursorGlow.style.opacity = '0';
      }
    });

    document.addEventListener('mouseenter', function() {
      if (cursorGlow) {
        cursorGlow.style.opacity = '0.55';
      }
    });

    fetch('https://api.countapi.xyz/hit/nezerkill-bio-site/views')
      .then(function(res) {
        if (!res.ok) {
          throw new Error('view counter request failed');
        }

        return res.json();
      })
      .then(function(data) {
        const views = document.getElementById('views-count');

        if (data && data.value !== undefined && Number.isFinite(Number(data.value))) {
          views.textContent = Number(data.value).toLocaleString();
        } else {
          views.textContent = '--';
        }
      })
      .catch(function() {
        document.getElementById('views-count').textContent = '--';
      });

    function formatCompactNumber(value) {
      if (!Number.isFinite(value)) {
        return '--';
      }

      return new Intl.NumberFormat('en', {
        notation: 'compact',
        maximumFractionDigits: 1
      }).format(value);
    }

    function setGithubFallback() {
      document.getElementById('github-stars').textContent = '--';
      document.getElementById('github-commits').textContent = '--';
      document.getElementById('github-followers').textContent = '--';
    }

    fetch('./stats.json', { cache: 'no-store' })
      .then(function(res) {
        if (!res.ok) {
          throw new Error('stats.json request failed');
        }

        return res.json();
      })
      .then(function(data) {
        document.getElementById('github-stars').textContent = formatCompactNumber(Number(data.stars));
        document.getElementById('github-commits').textContent = formatCompactNumber(Number(data.commits_last_month));
        document.getElementById('github-followers').textContent = formatCompactNumber(Number(data.followers));
      })
      .catch(function() {
        setGithubFallback();
      });

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play-btn');
    const progress = document.getElementById('progress');
    const progressBar = document.getElementById('progress-bar');
    const timeEl = document.getElementById('time');
    const durationEl = document.getElementById('duration');

    function formatTime(value) {
      if (!Number.isFinite(value) || value < 0) {
        return '0:00';
      }

      const minutes = Math.floor(value / 60);
      const seconds = Math.floor(value % 60);
      return minutes + ':' + String(seconds).padStart(2, '0');
    }

    function syncPlayState() {
      playBtn.innerHTML = audio.paused
        ? '<i class="fa-solid fa-play"></i>'
        : '<i class="fa-solid fa-pause"></i>';
    }

    playBtn.addEventListener('click', function() {
      if (audio.paused) {
        audio.play().catch(function() {});
      } else {
        audio.pause();
      }

      syncPlayState();
    });

    audio.addEventListener('loadedmetadata', function() {
      durationEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('timeupdate', function() {
      const duration = Number.isFinite(audio.duration) && audio.duration > 0 ? audio.duration : 0;
      const progressPercent = duration ? (audio.currentTime / duration) * 100 : 0;

      progressBar.style.width = progressPercent + '%';
      timeEl.textContent = formatTime(audio.currentTime);
    });

    audio.addEventListener('play', syncPlayState);
    audio.addEventListener('pause', syncPlayState);

    progress.addEventListener('click', function(e) {
      if (!Number.isFinite(audio.duration) || audio.duration <= 0) {
        return;
      }

      const rect = progress.getBoundingClientRect();
      const offsetX = e.clientX - rect.left;
      const ratio = Math.min(Math.max(offsetX / rect.width, 0), 1);

      audio.currentTime = ratio * audio.duration;
    });

    audio.addEventListener('ended', function() {
      progressBar.style.width = '0%';
      timeEl.textContent = '0:00';
      syncPlayState();
    });
  </script>
</body>
</html>
